<!-- - - -- -
  K·F BEATZ — a Beat engine
  - -- --- --
  Synth. No big Download Necessary. Email safe. 
  One self-contained file: Open it in a Browser.
  Works offline (synth, drums, samples, layers, MIDI import, WAV bounce). Drop a .mid
  to add a layer; drop a .wav/.mp3 to add a sample. The YouTube box is play-along only.
  Fonts load from Google if online and fall back to system stacks if not.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --neon:#34d0e6; --neon-dim:rgba(52,208,230,.2); --bronze:#caa24a;
    --panelA:#23292b; --panelB:#1c2123; --bay:#10191a; --inset:#121617;
    --ridge:#33403f; --shadow:#080b0c; --steel:#3a4750;
    --text:#dde7e6; --muted:#7e8e8d; --danger:#ff5e6b; --ok:#4fd39a; --solo:#caa24a;
    --font-display:'Chakra Petch', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', ui-monospace, 'SF Mono', 'Cascadia Code', Menlo, Consolas, monospace;
  }
  [data-theme="amber"]   { --neon:#ffb703; --neon-dim:rgba(255,183,3,.2);  --bay:#191510; --inset:#14120f; --panelA:#2a2420; --panelB:#231f1c; }
  [data-theme="magenta"] { --neon:#f72585; --neon-dim:rgba(247,37,133,.2); --bay:#19101a; --inset:#140f13; --panelA:#2a1f27; --panelB:#231c21; }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; color:var(--text);
    font:13px/1.5 var(--font-mono);
    background-color:#0f1314;
    background-image:
      linear-gradient(rgba(52,208,230,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(52,208,230,.05) 1px,transparent 1px),
      radial-gradient(circle at 18% -5%,rgba(52,208,230,.06),transparent 40%);
    background-size:44px 44px,44px 44px,auto;
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    transition:background-color .3s;
  }
  /* scanlines + vignette over everything (the GRRR) */
  body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:99; mix-blend-mode:multiply;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.13) 2px 3px),radial-gradient(130% 100% at 50% -10%,transparent 56%,rgba(0,0,0,.46)); }
  @media (prefers-reduced-motion:reduce){ body::after{ background:radial-gradient(130% 100% at 50% -10%,transparent 56%,rgba(0,0,0,.46)); } }

  .mono{ font-family:var(--font-mono); }
  .muted{ color:var(--muted); }
  .neon{ color:var(--neon); text-shadow:0 0 9px var(--neon-dim); }
  .hidden{ display:none !important; }
  .nosel{ user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }

  .wrap{ max-width:940px; margin:0 auto; padding:20px 16px 64px; display:flex; flex-direction:column; gap:15px; position:relative; z-index:1; }

  /* ── brushed-steel PANEL with iron braces + rivets + inset bay ── */
  .panel{ position:relative; border-radius:9px; padding:7px; border:1px solid hsl(190 14% 30%);
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),
      linear-gradient(180deg,var(--panelA),var(--panelB));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -1px 0 rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.4),0 18px 34px -22px #000;
    transition:background .3s; }
  .bay{ border-radius:6px; padding:15px; border:1px solid #2a3433; position:relative; background-color:var(--bay);
    box-shadow:inset 0 4px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04); }
  .panel>.brace{ position:absolute; width:14px; height:14px; border:2px solid var(--neon); opacity:.5; pointer-events:none; z-index:4; }
  .brace.tl{ top:-1px; left:-1px; border-right:0; border-bottom:0; border-top-left-radius:4px; }
  .brace.tr{ top:-1px; right:-1px; border-left:0; border-bottom:0; border-top-right-radius:4px; }
  .brace.bl{ bottom:-1px; left:-1px; border-right:0; border-top:0; border-bottom-left-radius:4px; }
  .brace.br{ bottom:-1px; right:-1px; border-left:0; border-top:0; border-bottom-right-radius:4px; }
  .panel>.rv{ position:absolute; width:6px; height:6px; border-radius:50%; z-index:4; pointer-events:none;
    background:radial-gradient(circle at 35% 30%,#6a7a7d,#1a2122 72%); box-shadow:inset 0 0 0 .5px rgba(0,0,0,.6),0 1px 1px rgba(0,0,0,.5),0 1px 0 rgba(255,255,255,.06); }
  .rv.tl{ top:7px; left:7px; } .rv.tr{ top:7px; right:7px; } .rv.bl{ bottom:7px; left:7px; } .rv.br{ bottom:7px; right:7px; }

  /* engraved seam under a header */
  .seam{ height:0; margin:9px -3px 13px; border-top:1px solid rgba(0,0,0,.6); box-shadow:0 1px 0 rgba(255,255,255,.05); position:relative; }
  .seam::before,.seam::after{ content:""; position:absolute; top:-3px; width:5px; height:5px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#5b6a6d,#1a2122 72%); box-shadow:inset 0 0 0 .5px rgba(0,0,0,.6); }
  .seam::before{ left:0; } .seam::after{ right:0; }

  /* ── header / brand ── */
  .header{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:14px; padding:13px 15px; }
  .brand{ display:flex; align-items:center; gap:13px; }
  .logo{ width:40px; height:40px; flex:0 0 auto; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font:700 13px var(--font-mono); color:#04222a; letter-spacing:.02em;
    background:linear-gradient(180deg,#5fe0ef,var(--neon)); border:1px solid transparent;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 2px 0 #134,0 6px 12px -6px rgba(52,208,230,.6); }
  .title{ font:700 18px/1.1 var(--font-display); letter-spacing:.16em; text-transform:uppercase; margin:0; position:relative; color:var(--neon); text-shadow:0 0 12px var(--neon-dim); }
  .title .dot{ color:var(--bronze); }
  .title::before{ content:"BEATZ"; position:absolute; left:0; top:0; color:rgba(247,37,133,.0); }
  .subtitle{ font:500 9px var(--font-mono); letter-spacing:.28em; color:var(--muted); margin:3px 0 0; }
  .toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pill{ display:inline-flex; align-items:center; gap:7px; font:600 10px var(--font-mono); letter-spacing:.1em; padding:5px 9px; border-radius:999px; box-shadow:inset 0 1px 2px rgba(0,0,0,.4); }
  .pill::before{ content:""; width:5px; height:5px; border-radius:50%; background:currentColor; box-shadow:0 0 6px currentColor; }
  .pill.ok{ color:var(--ok); background:rgba(79,211,154,.1); border:1px solid rgba(79,211,154,.3); }
  .pill.live{ color:var(--neon); background:var(--neon-dim); border:1px solid rgba(52,208,230,.3); }
  .select{ background:var(--inset); border:1px solid var(--ridge); color:var(--text); font:500 10px var(--font-mono); padding:7px; border-radius:5px; outline:none; cursor:pointer; }

  /* steel buttons with 3D travel */
  .sbtn{ font:600 10px var(--font-display); letter-spacing:.08em; text-transform:uppercase; color:var(--text); padding:9px 12px; border-radius:6px; cursor:pointer; position:relative;
    border:1px solid var(--ridge); background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px),linear-gradient(180deg,#2c3436,#222a2b);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 3px 0 var(--shadow),0 7px 13px -7px #000; transition:transform .07s,color .12s,border-color .12s; }
  .sbtn:hover{ border-color:var(--neon); color:var(--neon); }
  .sbtn:active{ transform:translateY(3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 0 0 var(--shadow); }
  .sbtn[disabled]{ opacity:.4; cursor:not-allowed; transform:none; }
  .sbtn.primary{ color:#04222a; background:linear-gradient(180deg,#5fe0ef,var(--neon)); border-color:transparent; box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 3px 0 #134,0 8px 16px -8px rgba(52,208,230,.5); }
  .sbtn.primary:hover{ color:#04222a; }
  .sbtn.bronze{ color:var(--bronze); }
  .sbtn.danger:hover{ border-color:var(--danger); color:var(--danger); }

  /* EQ */
  .eq{ height:46px; border-radius:6px; display:flex; align-items:flex-end; justify-content:space-between; gap:1px; padding:5px; }
  .eq-bar{ flex:1; background:var(--neon); border-radius:1px 1px 0 0; height:100%; transform:scaleY(.05); transform-origin:bottom; opacity:.85; box-shadow:0 0 6px var(--neon-dim); transition:transform .06s linear; }
  @media (prefers-reduced-motion:reduce){ .eq-bar{ transition:none; } }

  /* transport */
  .transport{ padding:13px 15px; }
  .t-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .t-label{ font:600 10px var(--font-mono); letter-spacing:.22em; color:var(--muted); }
  .divider{ flex:1; height:1px; background:var(--ridge); min-width:14px; }
  .timer{ font:700 16px var(--font-mono); color:var(--danger); letter-spacing:.08em; min-width:62px; text-align:right; }
  .tbtn{ width:44px; height:36px; display:flex; align-items:center; justify-content:center; border-radius:6px; cursor:pointer; color:var(--text); position:relative;
    border:1px solid var(--ridge); background:linear-gradient(180deg,#2c3436,#222a2b);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 3px 0 var(--shadow),0 6px 11px -6px #000; transition:transform .06s; }
  .tbtn:active{ transform:translateY(3px); box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 0 var(--shadow); }
  .tbtn svg{ width:15px; height:15px; }
  .tbtn[disabled]{ opacity:.32; cursor:not-allowed; transform:none; }
  .tbtn-rec svg{ color:var(--danger); } .tbtn-rec.on{ border-color:var(--danger); box-shadow:inset 0 0 12px rgba(255,94,107,.25),0 3px 0 var(--shadow); }
  .tbtn-play svg{ color:var(--neon); } .tbtn-play.on{ border-color:var(--neon); box-shadow:inset 0 0 12px var(--neon-dim),0 3px 0 var(--shadow); }
  .hint{ font:400 10px var(--font-mono); color:var(--muted); margin:10px 0 0; line-height:1.6; }

  /* tabs */
  .tabs{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
  .tabs::-webkit-scrollbar{ height:0; }
  .tab{ flex:1; min-width:96px; display:flex; align-items:center; justify-content:center; gap:8px; padding:13px; border-radius:7px; cursor:pointer;
    font:700 12px var(--font-display); letter-spacing:.04em; color:var(--muted);
    border:1px solid var(--ridge); background:linear-gradient(180deg,#262e30,#1d2425);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 0 var(--shadow); transition:color .12s,border-color .12s; }
  .tab svg{ width:16px; height:16px; flex:0 0 auto; }
  .tab.active{ color:var(--neon); border-color:var(--neon); box-shadow:inset 0 1px 0 rgba(255,255,255,.05),inset 0 0 14px var(--neon-dim); }
  .tab .bdg{ font:600 10px var(--font-mono); background:var(--neon-dim); color:var(--neon); border-radius:8px; padding:1px 6px; }

  /* panel head */
  .ph{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .ph .lead{ display:flex; align-items:center; gap:8px; font:600 11px var(--font-mono); letter-spacing:.16em; color:var(--text); }
  .ph .lead b{ color:var(--neon); font-weight:600; }
  .ph .led{ width:7px; height:7px; border-radius:50%; background:var(--neon); box-shadow:0 0 7px var(--neon); }
  .ph .ro{ font:400 10px var(--font-mono); color:var(--muted); }

  .keys-grid{ display:grid; grid-template-columns:1fr; gap:15px; }
  @media (min-width:880px){ .keys-grid{ grid-template-columns:1.35fr 1fr; } }

  /* synth controls */
  .ctl-row{ display:flex; flex-wrap:wrap; align-items:center; gap:13px; margin-bottom:12px; }
  .ctl-label{ font:600 10px var(--font-mono); letter-spacing:.16em; color:var(--muted); }
  .seg{ display:inline-flex; border:1px solid var(--ridge); border-radius:6px; overflow:hidden; background:var(--inset); }
  .seg button{ font:600 10px var(--font-mono); padding:7px 11px; background:transparent; color:var(--muted); border:none; border-right:1px solid var(--ridge); cursor:pointer; }
  .seg button:last-child{ border-right:none; }
  .seg button.active{ background:var(--neon-dim); color:var(--neon); }
  .oct{ display:inline-flex; align-items:center; gap:6px; }
  .oct button{ width:30px; height:30px; border-radius:5px; border:1px solid var(--ridge); background:linear-gradient(180deg,#2c3436,#222a2b); color:var(--text); font:600 15px var(--font-mono); cursor:pointer; line-height:1; }
  .oct .val{ font:600 11px var(--font-mono); color:var(--neon); min-width:26px; text-align:center; }
  .spacer{ flex:1; }

  /* piano */
  .piano{ position:relative; width:100%; height:128px; display:flex; border-radius:0 0 5px 5px; }
  .key-white{ flex:1; position:relative; cursor:pointer; background:linear-gradient(180deg,#dfe3e4 0%,#bcc1c3 85%,#a4abaf 100%); border:1px solid #7c858b; border-top:none; border-radius:0 0 4px 4px; box-shadow:inset 0 -3px 6px rgba(0,0,0,.3); }
  .key-white.pressed{ background:linear-gradient(180deg,#9fd9e2 0%,#74b7c2 100%); box-shadow:inset 0 2px 6px rgba(0,0,0,.4); }
  .key-black{ position:absolute; top:0; height:62%; z-index:10; cursor:pointer; background:linear-gradient(180deg,#1a2428 0%,#2a3438 60%,#1a2428 100%); border:1px solid #0a0e10; border-top:none; border-radius:0 0 3px 3px; box-shadow:2px 4px 8px rgba(0,0,0,.8); }
  .key-black.pressed{ background:linear-gradient(180deg,#1f6470 0%,#2a8a98 100%); box-shadow:1px 2px 4px rgba(0,0,0,.8); }
  .key-label{ position:absolute; bottom:6px; left:0; right:0; text-align:center; font:400 8px var(--font-mono); color:#6a7278; pointer-events:none; }
  .kbd-hints{ font:400 9px var(--font-mono); letter-spacing:.32em; color:var(--muted); text-align:center; margin-top:10px; opacity:.7; }

  /* pads */
  .pads{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .pad{ position:relative; aspect-ratio:1/1; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--ridge); background:repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px),linear-gradient(180deg,#262e30,#1c2324);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 2px 4px rgba(0,0,0,.35); transition:border-color .08s,box-shadow .08s; }
  .pad::before,.pad::after{ content:""; position:absolute; top:5px; width:4px; height:4px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#5b6a6d,#10898d00 72%),#1c2122; }
  .pad::before{ left:6px; } .pad::after{ right:6px; }
  .pad.active{ border-color:var(--neon); box-shadow:inset 0 0 16px var(--neon-dim),inset 0 2px 6px rgba(0,0,0,.5); }
  .pad-key{ position:absolute; bottom:7px; right:9px; font:400 9px var(--font-mono); color:var(--muted); }
  .pad-label{ font:700 11px var(--font-display); color:var(--text); letter-spacing:.03em; }

  /* mixer faders */
  .strips{ display:flex; gap:12px; overflow-x:auto; padding-bottom:14px; align-items:flex-start; }
  .strips::-webkit-scrollbar{ height:6px; } .strips::-webkit-scrollbar-thumb{ background:var(--ridge); border-radius:3px; }
  .strip{ position:relative; flex:0 0 auto; min-width:78px; display:flex; flex-direction:column; align-items:center; gap:8px; padding:12px 8px; border-radius:6px;
    border:1px solid #283130; background:linear-gradient(180deg,#181e1f,#1b2122); box-shadow:inset 0 1px 3px rgba(0,0,0,.45); }
  .strip-name{ font:700 10px var(--font-mono); letter-spacing:.06em; text-transform:uppercase; width:100%; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--neon); }
  .strip-x{ position:absolute; top:5px; right:5px; background:none; border:none; color:var(--muted); cursor:pointer; padding:2px; display:flex; }
  .strip-x:hover{ color:var(--danger); } .strip-x svg{ width:12px; height:12px; }
  .fl{ font:400 8px var(--font-mono); color:var(--muted); }
  .fl b{ color:var(--bronze); }
  .vol-wrap{ height:116px; display:flex; align-items:center; justify-content:center; }

  input[type=range].fv{ writing-mode:vertical-lr; direction:rtl; -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer; height:100%; }
  input[type=range].fv::-webkit-slider-runnable-track{ width:6px; background:var(--inset); border:1px solid var(--ridge); border-radius:3px; }
  input[type=range].fv::-moz-range-track{ width:6px; background:var(--inset); border:1px solid var(--ridge); border-radius:3px; }
  input[type=range].fv::-webkit-slider-thumb{ -webkit-appearance:none; width:30px; height:13px; background:linear-gradient(135deg,#6a7a80,#2a3438); border:1px solid #8b969b; border-radius:2px; margin-left:-12px; box-shadow:0 1px 2px rgba(0,0,0,.5); }
  input[type=range].fv::-moz-range-thumb{ width:30px; height:13px; background:linear-gradient(135deg,#6a7a80,#2a3438); border:1px solid #8b969b; border-radius:2px; }
  input[type=range].fh{ -webkit-appearance:none; appearance:none; background:transparent; cursor:pointer; height:14px; width:100%; }
  input[type=range].fh::-webkit-slider-runnable-track{ height:4px; background:var(--inset); border:1px solid var(--ridge); border-radius:2px; }
  input[type=range].fh::-moz-range-track{ height:4px; background:var(--inset); border:1px solid var(--ridge); border-radius:2px; }
  input[type=range].fh::-webkit-slider-thumb{ -webkit-appearance:none; width:11px; height:16px; background:linear-gradient(135deg,#6a7a80,#2a3438); border:1px solid #8b969b; border-radius:2px; margin-top:-7px; }
  input[type=range].fh::-moz-range-thumb{ width:11px; height:16px; background:linear-gradient(135deg,#6a7a80,#2a3438); border:1px solid #8b969b; border-radius:2px; }

  .ms-row{ display:flex; gap:6px; width:100%; }
  .ms-btn{ flex:1; padding:6px 0; border-radius:4px; font:700 9px var(--font-mono); background:var(--inset); border:1px solid var(--ridge); color:var(--muted); cursor:pointer; }
  .ms-btn.m-on{ background:var(--neon-dim); border-color:var(--neon); color:var(--neon); }
  .ms-btn.s-on{ background:rgba(202,162,74,.2); border-color:var(--solo); color:var(--solo); }
  .add-ch{ flex:0 0 auto; min-width:78px; height:262px; border-radius:6px; cursor:pointer; border:1px dashed var(--ridge); background:var(--inset); color:var(--muted); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; font:600 10px var(--font-mono); }
  .add-ch:hover{ color:#fff; border-color:var(--neon); } .add-ch svg{ width:20px; height:20px; }

  /* layers + samples shared controls */
  .ctlbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:13px; }
  .toggle{ font:700 10px var(--font-mono); letter-spacing:.06em; padding:9px 13px; border-radius:6px; border:1px solid var(--ridge); background:var(--inset); color:var(--muted); cursor:pointer; }
  .toggle.on{ border-color:var(--neon); background:var(--neon-dim); color:var(--neon); }
  .status{ font:400 10px var(--font-mono); color:var(--neon); min-height:15px; margin:2px 0 12px; }
  .empty{ font:400 11px var(--font-mono); color:var(--muted); padding:18px; text-align:center; border:1px dashed var(--ridge); border-radius:6px; }

  /* ============================ STATE ============================ */
  function migrateTake(t){ return { id:t.id, label:t.label, events:t.events||[], pan:(typeof t.pan==='number'?t.pan:0), volume:(typeof t.volume==='number'?t.volume:80), muted:!!t.muted }; }

  /* ============================ refs ============================ */

  /* ---- LIVE input ---- */
  function triggerLive(type, payload){
    ensureAudio();
    if (isRecording) recEvents.push({ time: performance.now() - recStart, type, payload });

  }

  refs.pads.addEventListener('pointerdown', (e) => { const el=e.target.closest('[data-sound]'); if (!el) return; triggerLive('drum',{sound:el.dataset.sound}); flashPad(el.dataset.sound); });

  /* ============================ TRANSPORT ============================ */
  function fmt(ms){ const s=Math.floor(ms/1000), m=Math.floor(s/60); return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
  function startTimer(){ timerBase=performance.now(); stopTimerInterval(); timerId=setInterval(()=>{ refs.timer.textContent=fmt(performance.now()-timerBase); },80); }
  function stopTimerInterval(){ if (timerId){ clearInterval(timerId); timerId=null; } }
  function resetTimer(){ stopTimerInterval(); refs.timer.textContent='00:00'; }

  function enabledTakes(){ return state.takes.filter(t => !t.muted && t.events.length); }
  function eventEndMs(ev){ if (ev.type==='sample') { const s=samples[ev.payload.sampleId]; return ev.time + (s ? Math.max(0, s.dur-(s.trimStart||0))*1000 : 0); } return ev.time + 650; }
  function takeEndMs(t){ let m=0; t.events.forEach(ev => { const e=eventEndMs(ev); if (e>m) m=e; }); return m; }
  function maxTakeMs(list){ let m=0; list.forEach(t => { const e=takeEndMs(t); if (e>m) m=e; }); return m; }

  function scheduleTakes(list, t0){
    const ids=[]; Audio.applyTakeMix(list);
    list.forEach(tk => {
      const dest = Audio.takeNode(tk.id).gain;
      tk.events.forEach(ev => {
        const delay = Math.max(0, ev.time - (performance.now() - t0));
        ids.push(setTimeout(() => {
          if (ev.type==='synth') { Audio.playSynth(ev.payload.note, ev.payload.waveform, dest, ev.payload.shift); flashKey(ev.payload.note,false); }
          else if (ev.type==='drum') { Audio.playDrum(ev.payload.sound, dest); flashPad(ev.payload.sound); }
          else if (ev.type==='sample') { const s=samples[ev.payload.sampleId]; if (s) Audio.playSample(s.buffer, dest, s.trimStart); flashSample(ev.payload.sampleId); }
        }, delay));
      });
    });
    return ids;
  }

  function stopPlayback(){ playTimers.forEach(clearTimeout); playTimers=[]; isPlaying=false; refs.play.classList.remove('on'); refs.play.innerHTML=ICON.play; if (!isRecording) resetTimer(); pauseYouTube(); }
  function togglePlay(){
    if (isPlaying) { stopPlayback(); return; }
    const list = enabledTakes(); if (!list.length) return; ensureAudio();
    isPlaying=true; refs.play.classList.add('on'); refs.play.innerHTML=ICON.pause; startTimer(); playYouTube();
    const t0=performance.now(); playTimers=scheduleTakes(list, t0); playTimers.push(setTimeout(stopPlayback, maxTakeMs(list)+600));
  }
  function toggleRecord(){
    if (isRecording) {
      isRecording=false; refs.rec.classList.remove('on'); refs.rec.innerHTML=ICON.rec;

      if (recEvents.length) { state.takes.push({ id:newId(), label:'Layer '+(state.takes.length+1), events:recEvents.slice(), pan:0, volume:80, muted:false }); persistTakes(); renderLayers(); setStatusL('Saved '+state.takes[state.takes.length-1].label+' ('+recEvents.length+' hits). Hit ▶ to play the stack.'); }
      else { setStatusL('Nothing recorded — layer discarded.'); }

    }
  }
  refs.rec.addEventListener('click', toggleRecord);
  refs.play.addEventListener('click', togglePlay);
  function setStatusL(m){ refs.statusL.textContent=m||''; }
  function setStatusS(m){ refs.statusS.textContent=m||''; }

  /* ============================ LAYERS ============================ */
  function persistTakes(){ Store.set('bf-takes', JSON.stringify(state.takes)); refreshCounts(); }
  function panLabel(p){ return p>0?('R'+Math.round(p*100)):(p<0?('L'+Math.round(-p*100)):'C'); }
  const hasOAC = !!(window.OfflineAudioContext || window.webkitOfflineAudioContext);

  function refreshCounts(){
    const n=state.takes.length; refs.layerCount.textContent = n+(n===1?' layer':' layers');

  }

  refs.layerList.addEventListener('input', (e) => {

  });

  /* ============================ WAV BOUNCE ============================ */
  function downloadBlob(blob, filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); }
  function safeName(s){ return String(s).replace(/[^\w.-]+/g,'_'); }
  function renderToBuffer(list){
    const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const lenSec = (maxTakeMs(list)/1000) + 1.0;
    const octx = new OAC(2, Math.max(1, Math.ceil(EXPORT_RATE*lenSec)), EXPORT_RATE);
    list.forEach(t => {
      const g=octx.createGain(); g.gain.value=t.volume/100; const pan=octx.createStereoPanner(); pan.pan.value=t.pan; g.connect(pan); pan.connect(octx.destination);
      t.events.forEach(ev => {
        const when=ev.time/1000;
        if (ev.type==='synth') synthVoice(octx, g, ev.payload.note, ev.payload.waveform, ev.payload.shift||0, when);
        else if (ev.type==='drum') drumVoice(octx, g, ev.payload.sound, when);
        else if (ev.type==='sample') { const s=samples[ev.payload.sampleId]; if (s && s.buffer) { const src=octx.createBufferSource(); src.buffer=s.buffer; src.connect(g); try{ src.start(when, s.trimStart||0); }catch(e){ src.start(when); } } }
      });
    });
    return Promise.resolve(octx.startRendering());
  }
  function exportTakeWav(take){ if (!hasOAC || !take.events.length) { setStatusL('Nothing to export.'); return; } setStatusL('Bouncing '+take.label+' → WAV…'); renderToBuffer([take]).then(buf => { downloadBlob(audioBufferToWav(buf), safeName(take.label)+'.wav'); setStatusL('Downloaded '+safeName(take.label)+'.wav'); }).catch(err => setStatusL('Bounce failed: '+err.message)); }
  refs.exportMix.addEventListener('click', () => { const list=enabledTakes(); if (!list.length) { setStatusL('No audible layers to bounce.'); return; } setStatusL('Bouncing '+list.length+' layers → WAV…'); renderToBuffer(list).then(buf => { downloadBlob(audioBufferToWav(buf), 'KF_BEATZ_Mix.wav'); setStatusL('Downloaded KF_BEATZ_Mix.wav'); }).catch(err => setStatusL('Bounce failed: '+err.message)); });

  /* ============================ MIDI + AUDIO LOADING ============================ */
  function importMidiFile(file){
    setStatusL('Reading '+file.name+'…');
    const reader=new FileReader();
    reader.onload=()=>{ try { const events=parseMidi(reader.result); if (!events.length) { setStatusL('No notes found in '+file.name+'.'); return; } const base=file.name.replace(/\.(mid|midi)$/i,'').substring(0,16); state.takes.push({ id:newId(), label:'MIDI: '+base, events, pan:0, volume:80, muted:false }); persistTakes(); renderLayers(); setStatusL('Imported '+events.length+' notes from '+file.name+'. Switch to ▶ to hear it.'); gotoTab('layers'); } catch(err) { setStatusL('Could not parse MIDI: '+err.message); } };
    reader.onerror=()=>setStatusL('Failed to read '+file.name+'.');
    reader.readAsArrayBuffer(file);
  }
  function loadAudioFile(file){
    ensureAudio(); setStatusS('Decoding '+file.name+'…');
    const reader=new FileReader();
    reader.onload=()=>{
      const ab=reader.result.slice(0);
      const done=(buf)=>{ const id=newId('smp_'); samples[id]={ name:file.name.replace(/\.[^.]+$/,'').substring(0,18), buffer:buf, dur:buf.duration, trimStart:0 }; renderSamples(); refreshCounts(); setStatusS('Loaded "'+samples[id].name+'" ('+buf.duration.toFixed(1)+'s). Tap it to trigger, record to sequence it.'); gotoTab('samples'); };
      const fail=(err)=>setStatusS('Could not decode '+file.name+': '+((err&&err.message)||'unsupported format'));
      // Use the promise form when available (modern); fall back to the callback form for old Safari.
      // Never use both, or the success handler fires twice and duplicates the sample.
      let p=null; try { p=Audio.ctx.decodeAudioData(ab); } catch(e){ p=null; }
      if (p && typeof p.then==='function') p.then(done).catch(fail);
      else { try { Audio.ctx.decodeAudioData(ab, done, fail); } catch(err){ fail(err); } }
    };
    reader.onerror=()=>setStatusS('Failed to read '+file.name+'.');
    reader.readAsArrayBuffer(file);
  }
  function routeFile(file){ const n=(file.name||'').toLowerCase(); if (/\.midi?$/.test(n)) importMidiFile(file); else if ((file.type&&file.type.indexOf('audio')===0) || /\.(wav|mp3|ogg|m4a|flac|aac)$/.test(n)) loadAudioFile(file); else setStatusS('Unsupported file: '+file.name); }

  refs.importMidi.addEventListener('click', () => refs.midiFile.click());
  refs.midiFile.addEventListener('change', (e) => { const f=e.target.files&&e.target.files[0]; if (f) importMidiFile(f); refs.midiFile.value=''; });
  refs.sampDrop.addEventListener('click', () => refs.audioFile.click());
  refs.audioFile.addEventListener('change', (e) => { const f=e.target.files&&e.target.files[0]; if (f) loadAudioFile(f); refs.audioFile.value=''; });

  /* SAMPLES */
  function renderSamples(){
    const ids=Object.keys(samples);
    if (!ids.length) { refs.sampList.innerHTML=''; return; }
    refs.sampList.innerHTML='';
    ids.forEach(id => {
      const s=samples[id]; const card=document.createElement('div'); card.className='smp';
      card.innerHTML = `
        <div class="smp-top">
          <button class="smp-trig" data-trig="${id}">▶ ${s.name}<small>${s.dur.toFixed(1)}s</small></button>
          <button class="mini x" data-delsmp="${id}">${ICON.x}</button>
        </div>
        <div class="card-row"><span class="cl">START <b data-trimL>${s.trimStart.toFixed(2)}s</b></span><input type="range" class="fh" min="0" max="${Math.max(0.01,s.dur).toFixed(2)}" step="0.01" value="${s.trimStart}" data-trim="${id}"></div>`;
      refs.sampList.appendChild(card);
    });
  }
  refs.sampList.addEventListener('pointerdown', (e) => { const t=e.target.closest('[data-trig]'); if (!t) return; triggerLive('sample',{sampleId:t.dataset.trig, name:samples[t.dataset.trig]&&samples[t.dataset.trig].name}); flashSample(t.dataset.trig); });
  refs.sampList.addEventListener('input', (e) => { const tr=e.target.closest('[data-trim]'); if (!tr) return; const s=samples[tr.dataset.trim]; if (!s) return; s.trimStart=parseFloat(tr.value); tr.closest('.card-row').querySelector('[data-trimL]').textContent=s.trimStart.toFixed(2)+'s'; });
  refs.sampList.addEventListener('click', (e) => { const d=e.target.closest('[data-delsmp]'); if (!d) return; delete samples[d.dataset.delsmp]; renderSamples(); refreshCounts(); });

  /* ============================ MIXER ============================ */
  function persistChannels(){ Store.set('bf-channels', JSON.stringify(state.channels)); }
  function renderStrips(){
    refs.strips.innerHTML='';
    state.channels.forEach(ch => {
      const isMaster=ch.id==='master'; const strip=document.createElement('div'); strip.className='strip';
      strip.innerHTML = `
        ${isMaster?'':`<button class="strip-x" title="Remove">${ICON.x}</button>`}
        <span class="strip-name">${ch.name}</span>
        <span class="fl">PAN <b data-pl>${panLabel(ch.pan)}</b></span>
        <input type="range" class="fh" min="-1" max="1" step="0.05" value="${ch.pan}" data-pan>
        <div class="vol-wrap"><input type="range" class="fv" min="0" max="100" value="${ch.volume}" data-vol></div>
        <span class="fl">VOL <b data-vl>${ch.volume}</b></span>
        <div class="ms-row"><button class="ms-btn ${ch.muted?'m-on':''}" data-mute>M</button>${isMaster?'':`<button class="ms-btn ${ch.solo?'s-on':''}" data-solo>S</button>`}</div>`;
      strip.querySelector('[data-vol]').addEventListener('input',(e)=>{ ch.volume=parseInt(e.target.value,10); strip.querySelector('[data-vl]').textContent=ch.volume; ensureAudio(); Audio.applyMix(state.channels); persistChannels(); });
      strip.querySelector('[data-pan]').addEventListener('input',(e)=>{ ch.pan=parseFloat(e.target.value); strip.querySelector('[data-pl]').textContent=panLabel(ch.pan); ensureAudio(); Audio.applyMix(state.channels); persistChannels(); });
      strip.querySelector('[data-mute]').addEventListener('click',()=>{ ch.muted=!ch.muted; ensureAudio(); Audio.applyMix(state.channels); persistChannels(); renderStrips(); });
      const sb=strip.querySelector('[data-solo]'); if (sb) sb.addEventListener('click',()=>{ ch.solo=!ch.solo; ensureAudio(); Audio.applyMix(state.channels); persistChannels(); renderStrips(); });
      const xb=strip.querySelector('.strip-x'); if (xb) xb.addEventListener('click',()=>{ state.channels=state.channels.filter(c=>c.id!==ch.id); persistChannels(); Audio.applyMix(state.channels); renderStrips(); });
      refs.strips.appendChild(strip);
    });
    const add=document.createElement('button'); add.className='add-ch'; add.innerHTML=ICON.plus+'<span>ADD CH</span>'; add.addEventListener('click',()=>addChannel()); refs.strips.appendChild(add);
  }
  function addChannel(name, id){
    name=name||('Ch '+state.channels.length); id=id||('ch_'+Date.now()); if (state.channels.find(c=>c.id===id)) return;
    const master=state.channels.find(c=>c.id==='master'); const rest=state.channels.filter(c=>c.id!=='master'); rest.push({ id, name, volume:80, pan:0, offsetMs:0, muted:false, solo:false });
    state.channels = master ? rest.concat([master]) : rest; persistChannels(); Audio.applyMix(state.channels); renderStrips();
  }

  /* ============================ TABS ============================ */
  function gotoTab(tab){ state.tab=tab; refs.tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab===tab)); ['keys','mixer','layers','samples'].forEach(id => $('#tab-'+id).classList.toggle('hidden', tab!==id)); }
  refs.tabs.addEventListener('click', (e) => { const b=e.target.closest('[data-tab]'); if (!b) return; gotoTab(b.dataset.tab); });

  /* ============================ THEME / RESET ============================ */
  refs.theme.value=state.theme;
  refs.theme.addEventListener('change',(e)=>{ state.theme=e.target.value; document.documentElement.setAttribute('data-theme', state.theme); Store.set('bf-theme', state.theme); });
  refs.reset.addEventListener('click',()=>{ Store.clear(); location.reload(); });

  /* ============================ YOUTUBE (play-along only) ============================ */
  function ytChannel(){ return null; }
  function ytIframe(){ return refs.ytActive.querySelector('iframe'); }
  function postYt(func){ if (isLocalFile) return; const f=ytIframe(); if (!f||!f.contentWindow) return; try { f.contentWindow.postMessage(JSON.stringify({event:'command',func,args:[]}),'*'); } catch(e){} }
  let ytLoaded=false;
  function playYouTube(){ if (ytLoaded) postYt('playVideo'); }
  function pauseYouTube(){ if (ytLoaded) postYt('pauseVideo'); }
  function parseYtId(s){ s=(s||'').trim(); if (/^[\w-]{11}$/.test(s)) return s; const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/); return m?m[1]:null; }
  refs.ytLoad.addEventListener('click', () => { const id=parseYtId(refs.ytUrl.value); if (!id) { setStatusS('Could not find a video ID in that link.'); return; } ytLoaded=true; refs.ytActive.innerHTML = `<div class="yt-active"><span class="ro" style="display:block; margin-bottom:8px;">PLAY-ALONG SOURCE${isLocalFile?' (local mode: open controls manually)':''}</span><iframe src="https://www.youtube.com/embed/${id}?enablejsapi=1&autoplay=0&controls=1" title="YouTube play-along" allow="autoplay; encrypted-media; picture-in-picture"></iframe></div>`; setStatusS('Loaded. If it shows Error 153, the clip blocks embedding or your browser is — try another link or open it in YouTube directly.'); });

  /* ============================ GLOBAL DRAG + DROP ============================ */
  const dropMask=document.getElementById('dropMask'); let dragDepth=0;
  function hasFiles(e){ return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types||[], 'Files') !== -1; }
  window.addEventListener('dragenter',(e)=>{ if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; dropMask.classList.add('show'); });
  window.addEventListener('dragover',(e)=>{ if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave',(e)=>{ if (!hasFiles(e)) return; dragDepth=Math.max(0,dragDepth-1); if (!dragDepth) dropMask.classList.remove('show'); });
  window.addEventListener('drop',(e)=>{ if (!hasFiles(e)) return; e.preventDefault(); dragDepth=0; dropMask.classList.remove('show'); const files=Array.prototype.slice.call(e.dataTransfer.files||[]); files.forEach(routeFile); });
  // local drop-zone highlight
  ['dragenter','dragover'].forEach(ev=>refs.sampDrop.addEventListener(ev,(e)=>{ e.preventDefault(); refs.sampDrop.classList.add('over'); }));
  ['dragleave','drop'].forEach(ev=>refs.sampDrop.addEventListener(ev,()=>refs.sampDrop.classList.remove('over')));

  /* ============================ INIT ============================ */
  renderStrips(); renderLayers(); renderSamples(); refreshCounts();

})();
</script>
</body>
</html>
